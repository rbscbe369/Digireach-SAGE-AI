version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://sage_user:sage_password@db:5432/sage_db?schema=public
      - REDIS_URL=redis://redis:6379/0
      - NEXTAUTH_SECRET=production_secret_32_chars_long_placeholder
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=sage_user
      - POSTGRES_PASSWORD=sage_password
      - POSTGRES_DB=sage_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
